ing-left: 20px; text-indent: -12px;\"\u003e\u0026bull;\u0026nbsp;\u0026nbsp;Order status and tracking updates\u003c/div\u003e\u003cdiv style=\"padding-left: 20px; text-indent: -12px;\"\u003e\u0026bull;\u0026nbsp;\u0026nbsp;Basic billing inquiries, and invoice requests\u003c/div\u003e\u003cdiv style=\"padding-left: 20px; text-indent: -12px;\"\u003e\u0026bull;\u0026nbsp;\u0026nbsp;Appointment bookings or cancellations\u003c/div\u003e\u003cdiv style=\"padding-left: 20px; text-indent: -12px;\"\u003e\u0026bull;\u0026nbsp;\u0026nbsp;Shipping and delivery questions\u003c/div\u003e\u003c/div\u003e","results_calculator_title":"AI Agents ROI Calculator","results_title":"Annual net savings","results_subtitle":"Estimated yearly savings from automated customer interactions with AI agents, after accounting for your Zendesk subscription.","results_annual_time_saved_label":"Annual time saved","results_return_on_investment_label":"Return on investment","results_payback_period_label":"Payback period","results_service_cost_impact_label":"Service cost impact","unit_hours":"hrs","unit_percent":"%","unit_months":"months","results_methodology_prompt":"Want to know how these numbers were calculated?","results_methodology_button":"View methodology","methodology_title":"Calculation methodology","methodology_html":"\u003ch3\u003eCalculation methodology\u003c/h3\u003e\u003cp\u003eThe following are considered in the calculation of the output values:\u003c/p\u003e\u003cdiv\u003e\u003cdiv style=\"padding-left: 20px; text-indent: -12px;\"\u003e\u0026bull;\u0026nbsp;\u0026nbsp;Service Cost is used as the base of calculation determined by number of agents × (Monthly salary × 12).\u003c/div\u003e\u003cdiv style=\"padding-left: 20px; text-indent: -12px;\"\u003e\u0026bull;\u0026nbsp;\u0026nbsp;Agents are considered 100% of their time dedicated to tickets (equal to 40 hours a week) that can be automated.\u003c/div\u003e\u003cdiv style=\"padding-left: 20px; text-indent: -12px;\"\u003e\u0026bull;\u0026nbsp;\u0026nbsp;Automation % directly correlates to the volume of contacts removed.\u003c/div\u003e\u003cdiv style=\"padding-left: 20px; text-indent: -12px;\"\u003e\u0026bull;\u0026nbsp;\u0026nbsp;An additional percentage average handle time reduction is applied (considering eligability, adoption and effectiveness) to any time remaining after automation due to information capture expediting agent resolution on uncontained tickets.\u003c/div\u003e\u003c/div\u003e\u003cp style=\"margin-top: 24px;\"\u003eThe following are the output values and how they are calculated:\u003c/p\u003e\u003cdiv\u003e\u003cdiv style=\"padding-left: 20px; text-indent: -12px; margin-bottom: 16px;\"\u003e\u0026bull;\u0026nbsp;\u0026nbsp;\u003cstrong\u003eSavings:\u003c/strong\u003e\u003cdiv style=\"padding-left: 20px; text-indent: 0; margin-top: 8px;\"\u003e((Total Cost to Serve × Automation rate) + (Cost of Remaining Contacts × AHT Reduction)) - Cost of Automated Resolutions over Allowance per plan\u003c/div\u003e\u003c/div\u003e\u003cdiv style=\"padding-left: 20px; text-indent: -12px; margin-bottom: 16px;\"\u003e\u0026bull;\u0026nbsp;\u0026nbsp;\u003cstrong\u003eAnnual time saved:\u003c/strong\u003e\u003cdiv style=\"padding-left: 20px; text-indent: 0; margin-top: 8px;\"\u003eDefinition: Time saved by automating contact removal and capturing information on un-contained contacts (not resolved by AI Agent), which reduces human agent handle time.\u003cbr/\u003eFormula: (Automated tickets × handle time) + (Non-automated tickets × handle time × handle time reduction)\u003c/div\u003e\u003c/div\u003e\u003cdiv style=\"padding-left: 20px; text-indent: -12px; margin-bottom: 16px;\"\u003e\u0026bull;\u0026nbsp;\u0026nbsp;\u003cstrong\u003eReturn on investment:\u003c/strong\u003e\u003cdiv style=\"padding-left: 20px; text-indent: 0; margin-top: 8px;\"\u003eDefinition: The benefit or profit gained relative to the amount invested.\u003cbr/\u003eFormula: Net savings ÷ Cost of investment\u003c/div\u003e\u003c/div\u003e\u003cdiv style=\"padding-left: 20px; text-indent: -12px; margin-bottom: 16px;\"\u003e\u0026bull;\u0026nbsp;\u0026nbsp;\u003cstrong\u003ePayback period:\u003c/strong\u003e\u003cdiv style=\"padding-left: 20px; text-indent: 0; margin-top: 8px;\"\u003eDefinition: The time, in months, required to recover the Zendesk subscription cost based on annual savings.\u003cbr/\u003eFormula: (Annual Zendesk subscription cost ÷ Annual savings) × 12 months\u003c/div\u003e\u003c/div\u003e\u003cdiv style=\"padding-left: 20px; text-indent: -12px; margin-bottom: 16px;\"\u003e\u0026bull;\u0026nbsp;\u0026nbsp;\u003cstrong\u003eService cost impact:\u003c/strong\u003e\u003cdiv style=\"padding-left: 20px; text-indent: 0; margin-top: 8px;\"\u003eDefinition: The net change in service cost after accounting for savings and adding the Zendesk subscription cost.\u003cbr/\u003eFormula: ((Revised cost to serve after savings + Annual Zendesk subscription cost) - Current annual service cost (total 100% occupancy)) ÷ Current annual service cost\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","disclaimer":"The estimates provided are for illustrative purposes only. Actual results may vary, and will depend on a variety of factors such as implementation practices, user adoption, and external economic conditions. Zendesk does not guarantee any financial outcomes or benefits, and is not responsible for the accuracy of the calculations."},"demoForm":{"btn_next_step":"Next","btn_next_step_alt":"Show me demo","btn_submit":"Start demo","company_lbl":"What company do you work for?","country_lbl":"Lastly, where are you located?","email_lbl":"What's your work email?","heading":"Customize your free Zendesk demo","job_function_lbl":"What is your job function?","job_role_lbl":"What is your job role?","job_title_lbl":"What is your job title?","lead_source_detail_lbl":"What are you solving for?","lead_source_detail_opt_both":"Both of the above","lead_source_detail_opt_sell":"Manage and engage sales leads","lead_s     return;

    `Attempting to set Adobe Edge Consent.\nCategories: \n\t${consentCatArray

      val: "n",

    personalize: {
